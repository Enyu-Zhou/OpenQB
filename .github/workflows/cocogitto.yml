name: Cocogitto

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  cocogitto:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Cocogitto
        env:
          COCOGITTO_VERSION: 7.0.0
        run: |
          curl -fsSL "https://github.com/cocogitto/cocogitto/releases/download/$COCOGITTO_VERSION/cocogitto-$COCOGITTO_VERSION-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/cocogitto.tar.gz"
          tar -xzf "$RUNNER_TEMP/cocogitto.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Check commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          # 使用 Git 确定范围，避免 Cocogitto 将根提交作为起点时也纳入校验。
          COMMITS="$(git rev-list "$BASE_SHA..$HEAD_SHA")"
          for COMMIT in $COMMITS; do
            cog --config .github/cog.toml check "$COMMIT..$COMMIT"
          done
