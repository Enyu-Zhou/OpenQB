name: Cocogitto

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  cocogitto:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Cocogitto
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update
          brew install cocogitto
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Check commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # 新分支首次推送没有前序提交，改用默认分支的共同祖先。
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]] && git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"; then
              BASE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
            else
              BASE_SHA=""
            fi
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          # 使用 Git 确定范围，避免 Cocogitto 将根提交作为起点时也纳入校验。
          COMMITS="$(git rev-list "${BASE_SHA:+$BASE_SHA..}$HEAD_SHA")"
          for COMMIT in $COMMITS; do
            cog --config .github/cog.toml check "$COMMIT..$COMMIT"
          done
