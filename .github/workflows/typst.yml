name: Typst

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Install tools
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update
          brew install typst typstyle tinymist
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: ./scripts/lint.sh
      - name: Build PDF
        run: ./scripts/build.sh
